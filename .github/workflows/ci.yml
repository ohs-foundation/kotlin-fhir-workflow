name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm-android-wasm:
    name: Desktop, Android and wasm
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: >-
          ./gradlew
          :workflow:desktopTest
          :workflow:wasmJsTest
          :workflow-demo:desktopTest
          :workflow-demo:wasmJsTest
          :workflow-demo:testDebugUnitTest
          --continue
  ios:
    name: iOS simulator
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: >-
          ./gradlew
          :workflow:iosSimulatorArm64Test
          :workflow-demo:iosSimulatorArm64Test
          --continue
